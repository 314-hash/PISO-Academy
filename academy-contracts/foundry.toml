[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"

[rpc_endpoints]
piso_devnet = "https://piso-rpc-dev.loca.lt"
piso_local = "http://127.0.0.1:8545"

[etherscan]
piso_devnet = { key = "na", url = "https://piso-blockchain.vercel.app/api" }
